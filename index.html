<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل البيانات</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #loading {
            text-align: center;
            display: none;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>نموذج الإدخال</h2>
    <form id="dataForm">
        <div class="form-group">
            <label for="reporter">المسؤول / المُبلغ:</label>
            <input type="text" id="reporter" required>
        </div>

        <div class="form-group">
            <label for="shift">الوردية:</label>
            <select id="shift">
                <option value="Morning">صباحية (Morning)</option>
                <option value="Evening">مسائية (Evening)</option>
                <option value="Night">ليلية (Night)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="area">المنطقة / الخط:</label>
            <input type="text" id="area" required>
        </div>

        <div class="form-group">
            <label for="product">المنتج:</label>
            <input type="text" id="product" required>
        </div>

        <div class="form-group">
            <label for="details">التفاصيل أو الملاحظات:</label>
            <textarea id="details" rows="3"></textarea>
        </div>

        <button type="submit" id="submitBtn">حفظ البيانات</button>
        <div id="loading">جاري الحفظ وتحديث الوقت بتوقيت جدة...</div>
    </form>
</div>

<script>
    // رابط السيرفر الجديد المحدث
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzwpUkt6rbAwVhYWelnGqcZkT4unC-FVcxEpEwuwNEONaPFwnoiApc5vXkw7XOEBJ-hmw/exec";

    document.getElementById('dataForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');

        submitBtn.style.display = 'none';
        loading.style.display = 'block';

        // تجميع البيانات الأساسية (السيرفر سيقوم بوضع تاريخ ووقت جدة تلقائياً)
        const formData = {
            id: 'id_' + Math.random().toString(36.substring(2, 9)),
            reporter: document.getElementById('reporter').value,
            shift: document.getElementById('shift').value,
            area: document.getElementById('area').value,
            product: document.getElementById('product').value,
            details: document.getElementById('details').value,
            status: 'Pending'
        };

        // إرسال البيانات إلى جوجل شيت
        fetch(WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors', // لتجنب مشاكل المتصفحات والجوالات مع CORS
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(formData)
        })
        .then(() => {
            alert('تم حفظ البيانات بنجاح بتوقيت جدة!');
            document.getElementById('dataForm').reset();
        })
        .catch(error => {
            console.error('Error:', error);
            alert('حدث خطأ أثناء الحفظ، تأكد من الاتصال.');
        })
        .finally(() => {
            submitBtn.style.display = 'block';
            loading.style.display = 'none';
        });
    });
</script>

</body>
</html>
