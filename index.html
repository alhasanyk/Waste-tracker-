<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق تسجيل الهدر</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f8f9fa; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<div class="container">
    <h2>تسجيل بيانات جديدة</h2>
    <form id="wasteForm">
        <div class="form-group">
            <label for="f_id">ID:</label>
            <input type="text" id="f_id" required>
        </div>
        
        <div class="form-group">
            <label for="f_date">التاريخ (Date):</label>
            <input type="date" id="f_date" required>
        </div>

        <div class="form-group">
            <label for="f_time">الوقت (Time) - غير قابل للاختيار:</label>
            <!-- تم قفل حقل الوقت هنا ليكون Read-only وخلفية رمادية -->
            <input type="time" id="f_time" readonly style="background-color: #e9ecef; cursor: not-allowed;">
        </div>

        <div class="form-group">
            <label for="f_shift">الوردية (Shift):</label>
            <input type="text" id="f_shift">
        </div>

        <div class="form-group">
            <label for="f_reporter">اسم المُبلغ (Reporter):</label>
            <input type="text" id="f_reporter">
        </div>

        <div class="form-group">
            <label for="f_area">المنطقة (Area):</label>
            <input type="text" id="f_area">
        </div>

        <div class="form-group">
            <label for="f_batch">رقم التشغيلة (Batch):</label>
            <input type="text" id="f_batch">
        </div>

        <div class="form-group">
            <label for="f_product">المنتج (Product):</label>
            <input type="text" id="f_product">
        </div>

        <div class="form-group">
            <label for="f_stage">المرحلة (Stage):</label>
            <input type="text" id="f_stage">
        </div>

        <div class="form-group">
            <label for="f_type">النوع (Type):</label>
            <input type="text" id="f_type">
        </div>

        <div class="form-group">
            <label for="f_qty">الكمية (Quantity):</label>
            <input type="number" id="f_qty">
        </div>

        <div class="form-group">
            <label for="f_unit">الوحدة (Unit):</label>
            <input type="text" id="f_unit">
        </div>

        <div class="form-group">
            <label for="f_cost">التكلفة (Cost):</label>
            <input type="number" step="0.01" id="f_cost">
        </div>

        <div class="form-group">
            <label for="f_cause">السبب (Cause):</label>
            <input type="text" id="f_cause">
        </div>

        <div class="form-group">
            <label for="f_details">التفاصيل (Details):</label>
            <textarea id="f_details"></textarea>
        </div>

        <div class="form-group">
            <label for="f_action">الإجراء (Action):</label>
            <input type="text" id="f_action">
        </div>

        <div class="form-group">
            <label for="f_status">الحالة (Status):</label>
            <input type="text" id="f_status">
        </div>

        <button type="submit" id="submitBtn">حفظ البيانات</button>
    </form>
</div>

<script>
    // تعيين الوقت والتاريخ الحاليين تلقائياً عند فتح الصفحة
    window.addEventListener('DOMContentLoaded', (event) => {
        const now = new Date();
        
        // تعيين التاريخ
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const dateField = document.getElementById('f_date');
        if(dateField && !dateField.value) {
            dateField.value = `${year}-${month}-${day}`;
        }

        // تعيين الوقت تلقائياً وقفل الحقل نهائياً
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const timeField = document.getElementById('f_time');
        if(timeField) {
            timeField.value = `${hours}:${minutes}`;
        }
    });

    // كود إرسال البيانات إلى جوجل شيت
    document.getElementById('wasteForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const formData = {
            id: document.getElementById('f_id').value,
            date: document.getElementById('f_date').value,
            time: document.getElementById('f_time').value, // سيُرسل الوقت الحالي المقفل تلقائياً
            shift: document.getElementById('f_shift').value,
            reporter: document.getElementById('f_reporter').value,
            area: document.getElementById('f_area').value,
            batch: document.getElementById('f_batch').value,
            product: document.getElementById('f_product').value,
            stage: document.getElementById('f_stage').value,
            type: document.getElementById('f_type').value,
            qty: document.getElementById('f_qty').value,
            unit: document.getElementById('f_unit').value,
            cost: document.getElementById('f_cost').value,
            cause: document.getElementById('f_cause').value,
            details: document.getElementById('f_details').value,
            action: document.getElementById('f_action').value,
            status: document.getElementById('f_status').value
        };

        // استبدل الرابط أدناه برابط الـ Apps Script الخاص بك
        const scriptURL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE';

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(response => {
            alert('تم الحفظ بنجاح!');
            document.getElementById('wasteForm').reset();
            // إعادة ضبط الوقت الحالي بعد مسح النموذج
            const now = new Date();
            document.getElementById('f_time').value = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
        })
        .catch(error => {
            alert('حدث خطأ أثناء الحفظ!');
            console.error('Error!', error.message);
        });
    });
</script>

</body>
</html>
