<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waste Tracker - Full Application</title>
  <style>
    :root {
      --primary: #2d7a44;
      --primary-light: #eaf4ed;
      --primary-dark: #1e532d;
      --bg: #f4f7f5;
      --card-bg: #ffffff;
      --text-main: #222222;
      --text-muted: #666666;
      --tag-bg: #e2f0e6;
      --tag-text: #2d7a44;
      --price-color: #b87333;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 15px; }
    .container { max-width: 500px; margin: 0 auto; }

    /* Top Cards Analytics */
    .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
    .kpi-card {
      background: #fff; border: 1.5px solid var(--primary); border-radius: 12px;
      padding: 10px 6px; text-align: center; display: flex; flex-direction: column; justify-content: center;
    }
    .kpi-title { font-size: 13px; font-weight: bold; color: var(--primary); line-height: 1.2; }
    .kpi-value { font-size: 16px; font-weight: 800; color: var(--primary-dark); margin: 4px 0; }
    .kpi-sub { font-size: 9px; color: var(--text-muted); text-transform: uppercase; line-height: 1.1; }

    /* Tabs */
    .tabs { display: flex; gap: 8px; margin-bottom: 15px; }
    .tab-btn {
      flex: 1; padding: 10px 4px; border: 1.5px solid var(--primary);
      background: white; color: var(--primary); font-weight: bold;
      border-radius: 10px; cursor: pointer; text-align: center; font-size: 14px;
    }
    .tab-btn.active { background: var(--primary); color: white; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Form & Filters Card */
    .card-box {
      background: var(--primary-light); border: 1.5px solid var(--primary);
      border-radius: 16px; padding: 15px; margin-bottom: 15px;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .field-group { margin-bottom: 10px; }
    .field-group label { display: block; font-size: 11px; font-weight: bold; color: var(--primary-dark); margin-bottom: 4px; text-transform: uppercase; }
    .field-group select, .field-group input, .field-group textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--primary);
      border-radius: 8px; background: white; outline: none; font-size: 13px;
    }

    .btn-submit {
      width: 100%; padding: 12px; background: var(--primary); color: white;
      border: none; border-radius: 10px; font-weight: bold; font-size: 15px; cursor: pointer;
    }

    /* Ticket Card Styling */
    .ticket {
      background: var(--card-bg); border: 1.5px solid #d0e2d5;
      border-radius: 16px; padding: 16px; margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .t-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
    .t-title { font-weight: 700; font-size: 16px; color: #111; display: flex; align-items: center; gap: 6px; }
    .t-title::before { content: "HB"; font-style: italic; font-weight: 300; color: #9bbca6; font-size: 14px; }
    .t-cost { font-size: 16px; font-weight: 700; color: var(--price-color); }
    .t-date { font-size: 12px; color: var(--text-muted); margin-bottom: 10px; }

    /* Tags */
    .t-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
    .tag {
      background: var(--tag-bg); color: var(--tag-text);
      padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 600;
    }
    .tag.status-done { background: #e2f0e6; color: var(--primary); }
    .tag.status-open { background: #fde8e8; color: #c53030; }

    .t-cause { font-size: 13px; color: #333; margin-bottom: 10px; line-height: 1.4; }
    .t-meta { font-size: 11px; color: #777; }
    .empty { text-align: center; color: var(--text-muted); padding: 20px; }
  </style>
</head>
<body>

<div class="container">
  <!-- Analytics Summary Header -->
  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-title" id="kpiTopArea">Area 1</div>
      <div class="kpi-sub">TOP WASTE/MONTH</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-value" id="kpiTotalCost">0</div>
      <div class="kpi-sub">COST (SAR)</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-title" id="kpiTopProduct">Halawa</div>
      <div class="kpi-sub">TOP WASTED PRODUCT</div>
    </div>
  </div>

  <!-- Navigation Tabs -->
  <div class="tabs">
    <button class="tab-btn" onclick="switchTab('add')">+ Add Waste</button>
    <button class="tab-btn active" onclick="switchTab('history')">History</button>
    <button class="tab-btn" onclick="switchTab('analyze')">Analyze</button>
  </div>

  <!-- TAB 1: ADD WASTE -->
  <div id="tab-add" class="tab-content">
    <div class="card-box">
      <form id="wasteForm" onsubmit="handleFormSubmit(event)">
        <div class="grid-2">
          <div class="field-group">
            <label>AREA</label>
            <select id="formArea" required>
              <option value="Area 1">Area 1</option>
              <option value="Area 2">Area 2</option>
            </select>
          </div>
          <div class="field-group">
            <label>PRODUCT</label>
            <input type="text" id="formProduct" placeholder="Product name" required>
          </div>
        </div>
        <div class="grid-2">
          <div class="field-group">
            <label>STAGE</label>
            <select id="formStage">
              <option value="Receiving">Receiving</option>
              <option value="Processing">Processing</option>
              <option value="Packaging">Packaging</option>
            </select>
          </div>
          <div class="field-group">
            <label>TYPE</label>
            <input type="text" id="formType" placeholder="e.g. Raw Material">
          </div>
        </div>
        <div class="grid-2">
          <div class="field-group">
            <label>QUANTITY</label>
            <input type="number" id="formQty" step="any" required>
          </div>
          <div class="field-group">
            <label>UNIT</label>
            <select id="formUnit">
              <option value="kg">kg</option>
              <option value="g">g</option>
              <option value="pcs">pcs</option>
            </select>
          </div>
        </div>
        <div class="grid-2">
          <div class="field-group">
            <label>COST (SAR)</label>
            <input type="number" id="formCost" step="any" required>
          </div>
          <div class="field-group">
            <label>BATCH</label>
            <input type="text" id="formBatch" placeholder="Batch ID">
          </div>
        </div>
        <div class="field-group">
          <label>ROOT CAUSE</label>
          <input type="text" id="formCause" placeholder="Cause description">
        </div>
        <div class="field-group">
          <label>ADDITIONAL DETAILS</label>
          <textarea id="formDetails" rows="2"></textarea>
        </div>
        <div class="grid-2">
          <div class="field-group">
            <label>REPORTER</label>
            <input type="text" id="formReporter" placeholder="Your name">
          </div>
          <div class="field-group">
            <label>SHIFT</label>
            <select id="formShift">
              <option value="Morning">Morning</option>
              <option value="Evening">Evening</option>
              <option value="Night">Night</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Save Record</button>
      </form>
    </div>
  </div>

  <!-- TAB 2: HISTORY -->
  <div id="tab-history" class="tab-content active">
    <div class="card-box">
      <div class="grid-2">
        <div class="field-group">
          <label>AREA</label>
          <select id="filterArea" onchange="renderHistory()">
            <option value="">All Areas</option>
            <option value="Area 1">Area 1</option>
            <option value="Area 2">Area 2</option>
          </select>
        </div>
        <div class="field-group">
          <label>PRODUCT</label>
          <select id="filterProduct" onchange="renderHistory()">
            <option value="">All Products</option>
          </select>
        </div>
      </div>
      <div class="grid-2">
        <div class="field-group">
          <label>FROM</label>
          <input type="date" id="filterDateFrom" onchange="renderHistory()">
        </div>
        <div class="field-group">
          <label>TO</label>
          <input type="date" id="filterDateTo" onchange="renderHistory()">
        </div>
      </div>
    </div>

    <div id="historyList"></div>
  </div>

  <!-- TAB 3: ANALYZE -->
  <div id="tab-analyze" class="tab-content">
    <div class="card-box" style="text-align: center; padding: 30px 15px;">
      <h3 style="color: var(--primary); margin-bottom: 10px;">Waste Analysis</h3>
      <p style="color: var(--text-muted); font-size: 13px;">Detailed graphical analysis metrics will display here based on Sheet records.</p>
    </div>
  </div>
</div>

<script>
  // رابط التطبيق الخاص بك
  const WEB_APP_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";
  let records = [];

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function cleanDateTime(val) {
    if (!val) return '';
    let str = String(val);
    return str.includes('T') ? str.split('T')[0] : str;
  }

  function cleanTime(val) {
    if (!val) return '';
    let str = String(val);
    if (str.includes('T')) {
      let t = str.split('T')[1];
      return t ? t.slice(0, 5) : '';
    }
    return str;
  }

  function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    if(tabName === 'add') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('tab-add').classList.add('active');
    } else if(tabName === 'history') {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('tab-history').classList.add('active');
    } else {
      document.querySelectorAll('.tab-btn')[2].classList.add('active');
      document.getElementById('tab-analyze').classList.add('active');
    }
  }

  async function loadRecords(){
    try {
      const response = await fetch(WEB_APP_URL, { redirect: 'follow' });
      const data = await response.json();
      
      if (Array.isArray(data)) {
        records = data.map(item => {
          if (Array.isArray(item)) {
            return {
              id: item[0] || '',
              date: cleanDateTime(item[1]),
              time: cleanTime(item[2]),
              shift: item[3] || '',
              reporter: item[4] || '',
              area: item[5] || '',
              batch: item[6] || '',
              product: item[7] || '',
              stage: item[8] || '',
              type: item[9] || '',
              qty: parseFloat(item[10]) || 0,
              unit: item[11] || '',
              cost: parseFloat(item[12]) || 0,
              cause: item[13] || '',
              details: item[14] || '',
              action: item[15] || '',
              status: item[16] || 'Resolved'
            };
          }
          return {
            id: item.id || '',
            date: cleanDateTime(item.date || item.Date),
            time: cleanTime(item.time || item.Time),
            shift: item.shift || item.Shift || '',
            reporter: item.reporter || item['Reported By'] || '',
            area: item.area || item.Area || '',
            batch: item.batch || item.Batch || '',
            product: item.product || item.Product || '',
            stage: item.stage || item.Stage || '',
            type: item.type || item['Waste Type'] || item.Type || '',
            qty: parseFloat(item.qty || item.Quantity || item.quantity) || 0,
            unit: item.unit || item.Unit || '',
            cost: parseFloat(item.cost || item.Cost) || 0,
            cause: item.cause || item['Root Cause'] || '',
            details: item.details || item['Additional Details'] || item.Details || '',
            action: item.action || item.Action || '',
            status: item.status || item.Status || 'Resolved'
          };
        });
      }
    } catch (e) {
      console.error("Error loading Google Sheet Data", e);
    }
    updateKPIs();
    populateProductDropdown();
    renderHistory();
  }

  function updateKPIs() {
    let totalCost = 0;
    records.forEach(r => totalCost += (r.cost || 0));
    document.getElementById('kpiTotalCost').innerText = totalCost.toLocaleString('en-US');
  }

  function populateProductDropdown() {
    const productSelect = document.getElementById('filterProduct');
    const products = [...new Set(records.map(r => r.product).filter(Boolean))];
    productSelect.innerHTML = '<option value="">All Products</option>' + 
      products.map(p => `<option value="${escapeHtml(p)}">${escapeHtml(p)}</option>`).join('');
  }

  function renderHistory(){
    const container = document.getElementById('historyList');
    const selectedArea = document.getElementById('filterArea').value;
    const selectedProduct = document.getElementById('filterProduct').value;
    const dateFrom = document.getElementById('filterDateFrom').value;
    const dateTo = document.getElementById('filterDateTo').value;

    let filtered = records.filter(r => {
      if (selectedArea && r.area !== selectedArea) return false;
      if (selectedProduct && r.product !== selectedProduct) return false;
      if (dateFrom && r.date < dateFrom) return false;
      if (dateTo && r.date > dateTo) return false;
      return true;
    });

    if(filtered.length === 0){
      container.innerHTML = '<div class="empty">No records found.</div>';
      return;
    }

    container.innerHTML = filtered.map(r => {
      const dateStr = r.date || '';
      const timeStr = r.time ? ` · ${r.time}` : '';
      const shiftStr = r.shift ? ` · ${r.shift}` : '';

      const causeText = r.cause ? r.cause : '';
      const detailsText = r.details ? ` — ${r.details}` : '';

      return `
        <div class="ticket">
          <div class="t-head">
            <div>
              <div class="t-title">${escapeHtml(r.product || 'Unspecified Product')}</div>
              <div class="t-date">${dateStr}${timeStr}${escapeHtml(shiftStr)}</div>
            </div>
            <div class="t-cost">${Number(r.cost || 0).toLocaleString('en-US')} SAR</div>
          </div>
          
          <div class="t-tags">
            ${r.area ? `<span class="tag">${escapeHtml(r.area)}</span>` : ''}
            ${r.stage ? `<span class="tag">${escapeHtml(r.stage)}</span>` : ''}
            ${r.type ? `<span class="tag">${escapeHtml(r.type)}</span>` : ''}
            ${r.qty ? `<span class="tag">${escapeHtml(r.qty)} ${escapeHtml(r.unit)}</span>` : ''}
            <span class="tag ${r.status === 'Resolved' ? 'status-done' : 'status-open'}">${escapeHtml(r.status || 'Resolved')}</span>
          </div>

          ${(causeText || detailsText) ? `
            <div class="t-cause">
              <strong>Cause:</strong> ${escapeHtml(causeText)}${escapeHtml(detailsText)}
            </div>
          ` : ''}

          <div class="t-meta">
            ${r.batch ? 'Batch: ' + escapeHtml(r.batch) : ''} 
            ${(r.batch && r.reporter) ? ' · ' : ''} 
            ${r.reporter ? 'Reported by: ' + escapeHtml(r.reporter) : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  async function handleFormSubmit(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "Saving...";

    const now = new Date();
    const payload = {
      id: "ID-" + Date.now(),
      date: now.toISOString().split('T')[0],
      time: now.toTimeString().slice(0, 5),
      shift: document.getElementById('formShift').value,
      reporter: document.getElementById('formReporter').value,
      area: document.getElementById('formArea').value,
      batch: document.getElementById('formBatch').value,
      product: document.getElementById('formProduct').value,
      stage: document.getElementById('formStage').value,
      type: document.getElementById('formType').value,
      qty: parseFloat(document.getElementById('formQty').value) || 0,
      unit: document.getElementById('formUnit').value,
      cost: parseFloat(document.getElementById('formCost').value) || 0,
      cause: document.getElementById('formCause').value,
      details: document.getElementById('formDetails').value,
      action: "",
      status: "Resolved"
    };

    try {
      await fetch(WEB_APP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      records.unshift(payload);
      document.getElementById('wasteForm').reset();
      switchTab('history');
      renderHistory();
      updateKPIs();
    } catch(err) {
      alert("Error saving record!");
    } finally {
      btn.disabled = false;
      btn.innerText = "Save Record";
    }
  }

  window.onload = loadRecords;
</script>

</body>
</html>
