<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HB Waste Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f4f6f8; padding: 20px; color: #333; }
    .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 22px; color: #1a252c; font-weight: bold; }
    .header p { font-size: 14px; color: #6c757d; }

    .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; border: 1px solid #007bff; background: #fff; color: #007bff; border-radius: 6px; font-weight: 600; cursor: pointer; text-align: center; }
    .tab-btn.active { background: #007bff; color: #fff; }

    .section-title { font-size: 13px; font-weight: 700; color: #007bff; text-transform: uppercase; letter-spacing: 0.5px; margin: 15px 0 10px; border-bottom: 1px solid #e9ecef; padding-bottom: 5px; }

    .form-group { margin-bottom: 15px; }
    .form-row { display: flex; gap: 15px; }
    .form-row .form-group { flex: 1; }

    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #495057; }
    input, select, textarea { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #ced4da; border-radius: 6px; outline: none; background: #fafafa; }
    input:focus, select:focus, textarea:focus { border-color: #007bff; background: #fff; }

    .btn-submit { width: 100%; padding: 12px; background: #28a745; color: #fff; font-size: 16px; font-weight: 600; border: none; border-radius: 6px; cursor: pointer; margin-top: 15px; }
    .btn-submit:hover { background: #218838; }
    .btn-submit:disabled { background: #6c757d; cursor: not-allowed; }

    /* Table Styles */
    .table-container { overflow-x: auto; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px; text-align: left; border-bottom: 1px solid #dee2e6; }
    th { background: #f8f9fa; font-weight: 600; color: #495057; }
    .loading { text-align: center; padding: 20px; color: #6c757d; font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>HB Waste Tracker</h1>
    <p>Internal Waste Recording System</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('add')">+ Add Waste</button>
    <button class="tab-btn" onclick="switchTab('history')">History Log</button>
  </div>

  <!-- ADD WASTE FORM -->
  <div id="addTab">
    <form id="wasteForm">
      <div class="section-title">BASIC INFORMATION</div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Date</label>
          <input type="date" id="date" required>
        </div>
        <div class="form-group">
          <label>Time</label>
          <input type="time" id="time" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Shift</label>
          <select id="shift" required>
            <option value="">Select Shift</option>
            <option>Morning</option>
            <option>Evening</option>
            <option>Night</option>
          </select>
        </div>
        <div class="form-group">
          <label>Reported By</label>
          <input type="text" id="reportedBy" placeholder="e.g., A. Mansour" required>
        </div>
      </div>

      <div class="form-group">
        <label>Area</label>
        <select id="area" required>
          <option value="">Select Area</option>
          <option>Area 1</option>
          <option>Area 2</option>
          <option>Packaging Line</option>
          <option>Kitchen / Preparation</option>
        </select>
      </div>

      <div class="form-group">
        <label>Batch / Lot Number</label>
        <input type="text" id="batch" placeholder="e.g., B-2026-0811">
      </div>

      <div class="section-title">PRODUCT & STAGE</div>

      <div class="form-group">
        <label>Product / Material</label>
        <input type="text" id="product" placeholder="e.g., Chocolate Halawa 250g" required>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Stage</label>
          <select id="stage" required>
            <option value="">Select Stage</option>
            <option>Raw Material</option>
            <option>In Process</option>
            <option>Finished Goods</option>
          </select>
        </div>
        <div class="form-group">
          <label>Waste Type</label>
          <select id="wasteType" required>
            <option value="">Select Waste Type</option>
            <option>Damage</option>
            <option>Expired</option>
            <option>Overweight / Underweight</option>
            <option>Spill / Process Loss</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Quantity / Weight (kg or units)</label>
        <input type="number" id="quantity" step="0.01" placeholder="0.00" required>
      </div>

      <div class="form-group">
        <label>Reason / Notes</label>
        <textarea id="reason" rows="2" placeholder="Describe reason for waste..."></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">Submit Waste Record</button>
    </form>
  </div>

  <!-- HISTORY LOG TAB -->
  <div id="historyTab" style="display: none;">
    <div class="section-title">RECORDS FROM GOOGLE SHEETS</div>
    <div id="loadingStatus" class="loading">Loading data...</div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>Reported By</th>
            <th>Product</th>
            <th>Qty</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  // أدوِر واستبدل هذا الرابط بـ Web App URL الخاص بك من Google Apps Script
  const SCRIPT_URL = 'ضع_رابط_GOOGLE_APPS_SCRIPT_هنا';

  // ضبط التاريخ والوقت تلقائياً عند الفتح
  window.addEventListener('DOMContentLoaded', () => {
    const now = new Date();
    document.getElementById('date').value = now.toISOString().split('T')[0];
    document.getElementById('time').value = now.toTimeString().split(' ')[0].substring(0,5);
    fetchSheetHistory();
  });

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    if(tab === 'add') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('addTab').style.display = 'block';
      document.getElementById('historyTab').style.display = 'none';
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('addTab').style.display = 'none';
      document.getElementById('historyTab').style.display = 'block';
      fetchSheetHistory();
    }
  }

  function fetchSheetHistory() {
    const loading = document.getElementById('loadingStatus');
    const tbody = document.getElementById('historyBody');
    loading.style.display = 'block';

    fetch(SCRIPT_URL)
      .then(res => res.json())
      .then(data => {
        loading.style.display = 'none';
        tbody.innerHTML = '';
        
        // عرض السجلات المجلوبة
        data.reverse().forEach(row => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${row['Date'] || row['date'] || '-'}</td>
            <td>${row['Reported By'] || row['reportedBy'] || '-'}</td>
            <td>${row['Product'] || row['product'] || '-'}</td>
            <td>${row['Quantity'] || row['quantity'] || '-'}</td>
          `;
          tbody.appendChild(tr);
        });
      })
      .catch(err => {
        loading.innerText = 'Unable to fetch records from Google Sheets.';
        console.error(err);
      });
  }

  // إرسال النموذج إلى Google Sheets
  document.getElementById('wasteForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = 'Submitting...';

    const payload = {
      date: document.getElementById('date').value,
      time: document.getElementById('time').value,
      shift: document.getElementById('shift').value,
      reportedBy: document.getElementById('reportedBy').value,
      area: document.getElementById('area').value,
      batch: document.getElementById('batch').value,
      product: document.getElementById('product').value,
      stage: document.getElementById('stage').value,
      wasteType: document.getElementById('wasteType').value,
      quantity: document.getElementById('quantity').value,
      reason: document.getElementById('reason').value
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(() => {
      alert('Waste record saved successfully!');
      document.getElementById('wasteForm').reset();
      
      // إعادة ملء الوقت والتاريخ
      const now = new Date();
      document.getElementById('date').value = now.toISOString().split('T')[0];
      document.getElementById('time').value = now.toTimeString().split(' ')[0].substring(0,5);

      btn.disabled = false;
      btn.innerText = 'Submit Waste Record';
    }).catch(err => {
      alert('Error saving record');
      btn.disabled = false;
      btn.innerText = 'Submit Waste Record';
    });
  });
</script>

</body>
</html>
